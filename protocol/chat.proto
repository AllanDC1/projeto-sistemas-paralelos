syntax = "proto3";

package chat.v1;

option java_package = "chat.protocol";
option java_multiple_files = true;

message Envelope {
  int64 sent_at_unix_ms = 1;
  int64 logical_clock = 2;

  oneof payload {
    LoginRequest login_request = 3;
    LoginResponse login_response = 4;
    CreateChannelRequest create_channel_request = 5;
    CreateChannelResponse create_channel_response = 6;
    ListChannelsRequest list_channels_request = 7;
    ListChannelsResponse list_channels_response = 8;
    PublishRequest publish_request = 9;
    PublishResponse publish_response = 10;
    ChannelMessage channel_message = 11;
    HistoryRequest history_request = 12;
    HistoryResponse history_response = 13;
    RegisterServerRequest register_server_request = 14;
    RegisterServerResponse register_server_response = 15;
    ListServersRequest list_servers_request = 16;
    ListServersResponse list_servers_response = 17;
    HeartbeatRequest heartbeat_request = 18;
    HeartbeatResponse heartbeat_response = 19;
    ClockRequest clock_request = 20;
    ClockResponse clock_response = 21;
    ElectionRequest election_request = 22;
    ElectionResponse election_response = 23;
    CoordinatorAnnouncement coordinator_announcement = 24;
    ReplicationEvent replication_event = 25;
  }
}

message LoginRequest {
  string username = 1;
}

message LoginResponse {
  bool success = 1;
  string error = 2;
}

message CreateChannelRequest {
  string username = 1;
  string channel_name = 2;
}

message CreateChannelResponse {
  bool success = 1;
  string error = 2;
}

message ListChannelsRequest {
  string username = 1;
}

message ListChannelsResponse {
  repeated string channels = 1;
}

message PublishRequest {
  string username = 1;
  string channel_name = 2;
  string message = 3;
}

message PublishResponse {
  bool success = 1;
  string error = 2;
}

message ChannelMessage {
  string username = 1;
  string channel_name = 2;
  string message = 3;
  int64 sent_at_unix_ms = 4;
}

message HistoryRequest {
  string channel_name = 1;
}

message HistoryResponse {
  repeated ChannelMessage messages = 1;
}

message RegisterServerRequest {
  string server_name = 1;
}

message RegisterServerResponse {
  int32 rank = 1;
}

message ListServersRequest {}

message ServerInfo {
  string server_name = 1;
  int32 rank = 2;
}

message ListServersResponse {
  repeated ServerInfo servers = 1;
}

message HeartbeatRequest {
  string server_name = 1;
}

message HeartbeatResponse {}

message ClockRequest {}

message ClockResponse {}

message ElectionRequest {}

message ElectionResponse {}

message CoordinatorAnnouncement {
  string server_name = 1;
}

message ReplicationEvent {
  string origin_server = 1;
  Envelope request = 2;
}
