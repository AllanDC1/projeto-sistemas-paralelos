services:
  server-1:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "server.py", "server-1"]
    depends_on:
      - proxy
    volumes:
      - server-1-data:/data

  server-2:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "server.py", "server-2"]
    depends_on:
      - proxy
    volumes:
      - server-2-data:/data

  broker:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "broker.py"]
    ports:
      - "5555:5555"
    depends_on:
      - server-1
      - server-2

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "proxy.py"]
    ports:
      - "5557:5557"
      - "5558:5558"

  client-1:
    build:
      context: .
      dockerfile: Dockerfile.java
    command: ["bot-java-1"]
    depends_on:
      - broker
      - proxy

  client-2:
    build:
      context: .
      dockerfile: Dockerfile.java
    command: ["bot-java-2"]
    depends_on:
      - broker
      - proxy

volumes:
  server-1-data:
  server-2-data: